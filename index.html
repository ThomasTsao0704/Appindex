<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INDEX — 應用目錄</title>
<meta name="description" content="以卡片目錄的方式收納並開啟你的所有應用程式">
<meta name="theme-color" content="#16211B">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INDEX">

<!-- 只保留一套標題字型（中文本來就會落到系統字型，載三套是純浪費） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#16211B;
    --panel:#1F2C24;
    --panel-hi:#26362c;
    --panel-line:#33453a;
    --parchment:#E8DFC8;
    --parchment-dim:#b7b19a;      /* 提高對比，小字才看得清楚 */
    --brass:#C89B3C;
    --brass-bright:#e0b658;
    --rust:#C4573B;
    --radius:14px;

    /* ── 文字大小：一個旋鈕控制全站 ──
       1 = 標準、1.15 = 大、1.3 = 特大（右上角「Aa」按鈕可即時切換） */
    --scale:1;
    --fs-2xs:calc(11.5px * var(--scale));   /* 編號、網域、標籤 */
    --fs-xs: calc(13.5px * var(--scale));   /* 篩選膠囊、分頁列 */
    --fs-sm: calc(14.5px * var(--scale));   /* 卡片說明 */
    --fs-md: calc(16px   * var(--scale));   /* 分區標題 */
    --fs-lg: calc(18px   * var(--scale));   /* 卡片名稱 */

    --font-display:'Fraunces', Georgia, 'Noto Serif TC', serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC',
                'PingFang TC', 'Microsoft JhengHei', sans-serif;
    --font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --header-h:150px;
    --bar-h:calc(58px + env(safe-area-inset-bottom, 0px));
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, #1b2a20 0%, transparent 60%),
      var(--ink);
    color:var(--parchment);
    font-family:var(--font-body);
    min-height:100dvh;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  a{ color:inherit; text-decoration:none; }
  button, select, input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  /* ================= 頂部：捲動時自動收合品牌列 ================= */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(22,33,27,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--panel-line);
    padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 8px;
  }
  .wrap{ max-width:1100px; margin:0 auto; }

  .brand{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    max-height:64px; overflow:hidden;
    transition:max-height .18s ease, opacity .18s ease, margin .18s ease;
  }
  header.compact .brand{ max-height:0; opacity:0; margin-bottom:-6px; }
  .brand-mark{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark h1{
    font-family:var(--font-display); font-weight:700;
    font-size:calc(26px * var(--scale));
    letter-spacing:.5px; margin:0;
  }
  .brand-mark .tab{
    font-family:var(--font-mono); font-size:calc(10.5px * var(--scale));
    letter-spacing:1.5px;
    background:var(--brass); color:var(--ink); padding:2px 7px; border-radius:4px;
  }
  .brand-actions{ display:flex; align-items:center; gap:4px; }
  .icon-btn{
    width:44px; height:44px; display:grid; place-items:center;
    background:none; border:none; color:var(--parchment-dim); border-radius:10px;
    cursor:pointer;
  }
  .icon-btn:active{ background:var(--panel-hi); color:var(--brass-bright); }
  .icon-btn.accent{ color:var(--brass-bright); }
  .icon-btn[hidden]{ display:none; }
  .icon-btn.spin svg{ animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  /* 文字大小切換鈕：目前不是標準大小時亮起，一眼看得出已放大 */
  #fontBtn .aa{ font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:.5px; }
  #fontBtn.on{ color:var(--brass-bright); }

  /* 搜尋 */
  .search{ position:relative; margin-top:6px; }
  .search input{
    width:100%; background:var(--panel); border:1px solid var(--panel-line);
    color:var(--parchment);
    font-size:max(16px, var(--fs-sm)); /* 16px 才不會讓 iOS 自動放大頁面 */
    padding:13px 46px 13px 40px; border-radius:12px; outline:none;
    appearance:none; -webkit-appearance:none;
  }
  .search input::-webkit-search-cancel-button{ display:none; }
  .search input::placeholder{ color:var(--parchment-dim); }
  .search input:focus{ border-color:var(--brass); }
  .search .ico{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.6; }
  .search .clear{
    position:absolute; right:2px; top:50%; transform:translateY(-50%);
    width:44px; height:44px; display:none; place-items:center;
    background:none; border:none; color:var(--parchment-dim); cursor:pointer;
  }
  .search.filled .clear{ display:grid; }

  /* 篩選膠囊：單排橫向捲動，不再佔第二、三排高度 */
  .chips{
    display:flex; gap:6px; overflow-x:auto; margin-top:8px;
    padding-bottom:2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chips button{
    flex:0 0 auto; background:transparent; border:1px solid var(--panel-line);
    color:var(--parchment-dim); font-size:var(--fs-xs); padding:8px 14px;
    border-radius:999px; cursor:pointer; min-height:38px;
  }
  .chips button.active{ background:var(--brass); border-color:var(--brass); color:var(--ink); font-weight:600; }
  .chips button.clear-tags{ color:var(--rust); border-color:transparent; }

  /* A–Z 快速跳頁 */
  .rail{
    display:flex; gap:2px; overflow-x:auto; margin-top:6px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .rail::-webkit-scrollbar{ display:none; }
  .rail[hidden]{ display:none; }
  .rail button{
    flex:0 0 auto; min-width:36px; height:36px;
    background:none; border:none; color:var(--parchment-dim);
    font-family:var(--font-mono); font-size:var(--fs-xs); border-radius:8px; cursor:pointer;
  }
  .rail button:active{ background:var(--brass); color:var(--ink); }

  /* ================= 內容 ================= */
  main{
    max-width:1100px; margin:0 auto;
    padding:14px 14px calc(var(--bar-h) + 24px);
  }
  .section-label{
    font-family:var(--font-display); font-weight:600; font-size:var(--fs-md);
    color:var(--brass); margin:22px 0 10px; display:flex; align-items:center; gap:10px;
    scroll-margin-top:calc(var(--header-h) + 8px);
  }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--panel-line); }
  .section-label:first-child{ margin-top:2px; }

  /* 欄寬跟著文字放大：字調大時會自動從兩欄變一欄，不會擠成一團 */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(calc(150px * var(--scale)),1fr)); gap:10px; }
  @media (min-width:520px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(calc(220px * var(--scale)),1fr)); gap:14px; }
    main{ padding:20px 20px 40px; }
  }

  .card{
    position:relative; background:var(--panel);
    border:1px solid var(--panel-line); border-radius:var(--radius);
    padding:15px 13px 12px; display:flex; flex-direction:column; gap:7px;
    min-height:calc(140px * var(--scale));
    transition:transform .12s ease, border-color .12s ease;
  }
  .card::before{
    content:''; position:absolute; top:-1px; right:14px; width:28px; height:7px;
    background:var(--brass); border-radius:0 0 4px 4px;
  }
  .card:active{ transform:scale(.975); border-color:var(--brass); }
  @media (hover:hover){
    .card:hover{ transform:translateY(-3px); border-color:var(--brass); box-shadow:0 10px 24px rgba(0,0,0,.35); }
  }
  .stretched-link{
    position:absolute; inset:0; z-index:1; border-radius:inherit;
    background:none; border:none; padding:0; margin:0; cursor:pointer;
    appearance:none; -webkit-appearance:none;
  }
  .card > *:not(.stretched-link):not(.star):not(.edit){ position:relative; z-index:2; pointer-events:none; }

  .no{ font-family:var(--font-mono); font-size:var(--fs-2xs); color:var(--parchment-dim); letter-spacing:1px; }
  .card h2{
    font-family:var(--font-display); font-weight:600; font-size:var(--fs-lg); margin:0;
    line-height:1.35; overflow-wrap:anywhere; padding-right:40px; /* 讓開右上角星星 */
  }
  .card p{
    font-size:var(--fs-sm); line-height:1.55; color:var(--parchment-dim); margin:0; flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tag-row{ display:flex; gap:4px; flex-wrap:wrap; }
  .tag-pill{
    font-family:var(--font-mono); font-size:var(--fs-2xs); color:var(--brass-bright);
    border:1px solid var(--panel-line); padding:3px 8px; border-radius:999px;
  }
  .foot{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding-top:8px; border-top:1px dashed var(--panel-line);
  }
  .domain{
    font-family:var(--font-mono); font-size:var(--fs-2xs); color:var(--brass-bright);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* 星星：44×44 的觸控範圍，圖示維持小巧 */
  .star{
    position:absolute; top:0; right:0; z-index:3;
    width:44px; height:44px; display:grid; place-items:center;
    background:none; border:none; cursor:pointer;
    font-size:19px; line-height:1; color:#48604f; padding:0;
    transition:transform .12s ease, color .12s ease;
  }
  .star.active{ color:var(--brass); }
  .star:active{ transform:scale(1.25); }

  /* ================= 狀態 ================= */
  .state{ text-align:center; padding:56px 16px; color:var(--parchment-dim); }
  .state h3{ font-family:var(--font-display); color:var(--parchment); font-size:calc(20px * var(--scale)); margin:0 0 8px; }
  .state p{ font-size:var(--fs-sm); margin:0 0 16px; line-height:1.7; }
  .state code{ font-family:var(--font-mono); background:var(--panel); padding:2px 6px; border-radius:4px; }
  .retry{
    background:var(--brass); color:var(--ink); border:none; padding:12px 22px;
    border-radius:10px; font-size:var(--fs-sm); font-weight:600; cursor:pointer; min-height:44px;
  }
  .skeleton-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(calc(150px * var(--scale)),1fr)); gap:10px; }
  @media (min-width:520px){ .skeleton-grid{ grid-template-columns:repeat(auto-fill, minmax(calc(220px * var(--scale)),1fr)); gap:14px; } }
  .skeleton{
    height:calc(140px * var(--scale)); border-radius:var(--radius); border:1px solid var(--panel-line);
    background:linear-gradient(100deg, var(--panel) 40%, var(--panel-hi) 50%, var(--panel) 60%);
    background-size:200% 100%; animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }

  /* 離線提示 */
  .offline{
    display:none; align-items:center; gap:8px; margin:0 0 12px;
    background:rgba(196,87,59,.12); border:1px solid rgba(196,87,59,.4);
    color:#e8a08c; font-size:var(--fs-xs); padding:10px 12px; border-radius:10px;
    line-height:1.5;
  }
  .offline.show{ display:flex; }

  /* ================= 底部分頁列（拇指區） ================= */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    display:grid; grid-template-columns:repeat(4,1fr);
    background:rgba(22,33,27,.94); backdrop-filter:blur(10px);
    border-top:1px solid var(--panel-line);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    transform:translateZ(0);            /* ← 新增：獨立圖層，捲動時較穩 */
    -webkit-transform:translateZ(0);    /* ← 新增 */
  }
  .tabbar button{
    background:none; border:none; color:var(--parchment-dim); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; height:58px; font-size:var(--fs-xs);
  }
  .tabbar button.active{ color:var(--brass-bright); font-weight:600; }
  .tabbar .dot{ width:4px; height:4px; border-radius:50%; background:transparent; }
  .tabbar button.active .dot{ background:var(--brass); }
  @media (min-width:900px){
    .tabbar{ position:sticky; max-width:1100px; margin:0 auto 20px; border-radius:14px; border:1px solid var(--panel-line); bottom:20px; }
  }

  /* ================= 編輯：卡片上的鉛筆 ================= */
  .edit{
    position:absolute; right:2px; bottom:0; z-index:3;
    width:44px; height:44px; display:grid; place-items:center;
    background:none; border:none; cursor:pointer;
    color:#5d7466; padding:0;
  }
  .edit:active{ color:var(--brass-bright); }
  .card .foot .domain{ max-width:calc(100% - 34px); }

  /* ================= 編輯面板 / 詳細視窗 共用 ================= */
  .sheet{ position:fixed; inset:0; z-index:60; display:none; }
  .sheet.open{ display:block; }
  .sheet-bg{ position:absolute; inset:0; background:rgba(9,14,11,.62); }
  .sheet-panel{
    position:absolute; left:0; right:0; bottom:0;
    max-height:90dvh; overflow-y:auto;
    background:var(--panel); border-top:1px solid var(--panel-line);
    border-radius:18px 18px 0 0;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    animation:rise .18s ease;
  }
  @keyframes rise{ from{ transform:translateY(18px); opacity:.6; } }
  @media (min-width:640px){
    .sheet-panel{
      left:50%; right:auto; bottom:auto; top:7vh; transform:translateX(-50%);
      width:min(520px, 92vw); border-radius:18px; border:1px solid var(--panel-line);
    }
  }
  .sheet-grip{ width:40px; height:4px; border-radius:999px; background:var(--panel-line); margin:0 auto 12px; }
  .sheet h3{
    font-family:var(--font-display); font-size:var(--fs-md); color:var(--brass);
    margin:0 0 12px;
  }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:var(--fs-2xs); letter-spacing:.5px;
    color:var(--parchment-dim); font-family:var(--font-mono); margin-bottom:5px;
  }
  .field input, .field textarea{
    width:100%; background:var(--ink); border:1px solid var(--panel-line);
    color:var(--parchment); border-radius:10px; padding:12px;
    font-size:max(16px, var(--fs-sm)); line-height:1.5; outline:none;
    appearance:none; -webkit-appearance:none;
  }
  .field textarea{ resize:vertical; min-height:150px; line-height:1.6; }
  .field input:focus, .field textarea:focus{ border-color:var(--brass); }
  .field .hint{ font-size:var(--fs-2xs); color:var(--parchment-dim); margin-top:5px; }
  .sheet-actions{ display:flex; gap:8px; margin-top:16px; }
  .btn{
    flex:1; min-height:48px; border-radius:12px; cursor:pointer;
    font-size:var(--fs-sm); font-weight:600; border:1px solid var(--panel-line);
    background:transparent; color:var(--parchment);
    display:flex; align-items:center; justify-content:center;
  }
  .btn[hidden]{ display:none; }
  .btn.primary{ background:var(--brass); border-color:var(--brass); color:var(--ink); }
  .btn.primary[disabled]{ opacity:.55; }
  .btn.danger{ flex:0 0 auto; width:52px; color:var(--rust); font-weight:400; }
  .btn.danger[hidden]{ display:none; }

  /* ================= 詳細視窗專屬 ================= */
  #detailNo{ display:block; margin-bottom:6px; }
  #detailTitle{
    font-family:var(--font-display); font-weight:600;
    font-size:var(--fs-lg); color:var(--parchment);
    margin:2px 0 10px; line-height:1.35; overflow-wrap:anywhere;
  }
  #detailTags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  #detailTags:empty{ display:none; }
  #detailDesc{
    font-size:var(--fs-sm); line-height:1.75; color:var(--parchment);
    margin:0 0 14px; white-space:pre-wrap; overflow-wrap:anywhere;
  }
  #detailDomain{
    font-family:var(--font-mono); font-size:var(--fs-2xs);
    color:var(--brass-bright); margin-bottom:2px; overflow-wrap:anywhere;
  }

  /* 提示條 */
  .toast{
    position:fixed; left:50%; bottom:calc(var(--bar-h) + 16px); transform:translateX(-50%);
    z-index:70; max-width:88vw; text-align:center;
    background:var(--panel-hi); border:1px solid var(--panel-line); color:var(--parchment);
    padding:11px 18px; border-radius:999px; font-size:var(--fs-xs); line-height:1.4;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  footer{
    text-align:center; padding:4px 20px 0; color:var(--parchment-dim);
    font-family:var(--font-mono); font-size:var(--fs-2xs); opacity:.6;
  }

  /* 隱藏「新增」與卡片「編輯」圖示：透明但仍可點 */
#addBtn,
#addBtn:active,
.edit,
.edit:active{
  color:transparent;
}
</style>
</head>
<body>

<header id="header">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">
        <h1>INDEX</h1>
        <span class="tab">目錄</span>
      </div>
      <div class="brand-actions">
        <span class="no" id="count" style="margin-right:4px"></span>
        <button class="icon-btn" id="fontBtn" aria-label="調整文字大小"><span class="aa">Aa</span></button>
        <button class="icon-btn" id="addBtn" aria-label="新增項目">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="refreshBtn" aria-label="重新讀取目錄">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn accent" id="installBtn" aria-label="安裝到主畫面" hidden>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
      </div>
    </div>

    <div class="search" id="searchWrap">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="search" inputmode="search" enterkeyhint="search"
             placeholder="搜尋名稱、說明或標籤…" autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="clear" id="clearSearch" aria-label="清除搜尋">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="chips" id="chips" aria-label="標籤篩選"></nav>
    <nav class="rail" id="rail" aria-label="字母索引"></nav>
  </div>
</header>

<main id="main">
  <div class="offline" id="offlineNote">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
    <span>目前顯示上次存下的目錄，連上網路後會自動更新。</span>
  </div>
  <div class="skeleton-grid" id="skeleton">
    <div class="skeleton"></div><div class="skeleton"></div>
    <div class="skeleton"></div><div class="skeleton"></div>
    <div class="skeleton"></div><div class="skeleton"></div>
  </div>
</main>

<nav class="tabbar" id="tabbar" aria-label="檢視模式">
  <button data-view="alpha" class="active"><span>目錄</span><span class="dot"></span></button>
  <button data-view="fav"><span>收藏</span><span class="dot"></span></button>
  <button data-view="popular"><span>常用</span><span class="dot"></span></button>
  <button data-view="recent"><span>最新</span><span class="dot"></span></button>
</nav>

<!-- 詳細資訊視窗：點卡片時彈出 -->
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="sheet-bg" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-grip"></div>
    <span class="no" id="detailNo"></span>
    <h3 id="detailTitle"></h3>
    <div id="detailTags"></div>
    <p id="detailDesc"></p>
    <div id="detailDomain"></div>
    <div class="sheet-actions">
      <!-- <button class="btn" id="detailEditBtn">編輯</button> -->
      <a class="btn primary" id="detailOpenBtn" href="#" target="_blank" rel="noopener noreferrer">打開網站</a>
    </div>
  </div>
</div>

<!-- 編輯 / 新增面板 -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-bg" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-grip"></div>
    <h3 id="sheetTitle">新增項目</h3>

    <div class="field">
      <label for="fApp">名稱</label>
      <input id="fApp" type="text" autocomplete="off" placeholder="例如：發票整理表">
    </div>
    <div class="field">
      <label for="fUrl">網址</label>
      <input id="fUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" placeholder="https://">
    </div>
    <div class="field">
      <label for="fDesc">說明</label>
      <textarea id="fDesc" rows="6" placeholder="說明這個工具做什麼，可以寫長一點"></textarea>
      <div class="hint"><span id="descCount">0</span> 字</div>
    </div>
    <div class="field">
      <label for="fTags">標籤</label>
      <input id="fTags" type="text" autocomplete="off" placeholder="工作, 設計">
      <div class="hint">用逗號分隔，會變成卡片上的標籤與上方的篩選鈕。</div>
    </div>

    <div class="sheet-actions">
      <button class="btn danger" id="deleteBtn" aria-label="刪除這一筆" hidden>刪除</button>
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
 * 設定：換成你部署 Apps Script 後拿到的網址（結尾是 /exec）
 * ===================================================================== */
const API_URL ='https://script.google.com/macros/s/AKfycbyCjqxwnXp87Y_jgt6I8ChTEtrSZmXU5i1McajKvKYjItvhxeWLbUP2LUgc5dk0C7cR/exec';

const FAV_KEY   = 'index_favorites_v1';
const USAGE_KEY = 'index_usage_v1';
const CACHE_KEY = 'index_cache_v1';
const SCALE_KEY = 'index_scale_v1';

const els = {
  header:document.getElementById('header'),
  main:document.getElementById('main'),
  skeleton:document.getElementById('skeleton'),
  offline:document.getElementById('offlineNote'),
  count:document.getElementById('count'),
  search:document.getElementById('searchInput'),
  searchWrap:document.getElementById('searchWrap'),
  clearSearch:document.getElementById('clearSearch'),
  chips:document.getElementById('chips'),
  rail:document.getElementById('rail'),
  tabbar:document.getElementById('tabbar'),
  refreshBtn:document.getElementById('refreshBtn'),
  installBtn:document.getElementById('installBtn'),
  fontBtn:document.getElementById('fontBtn'),
  addBtn:document.getElementById('addBtn'),
  sheet:document.getElementById('sheet'),
  sheetTitle:document.getElementById('sheetTitle'),
  fApp:document.getElementById('fApp'),
  fUrl:document.getElementById('fUrl'),
  fDesc:document.getElementById('fDesc'),
  descCount:document.getElementById('descCount'),
  fTags:document.getElementById('fTags'),
  saveBtn:document.getElementById('saveBtn'),
  cancelBtn:document.getElementById('cancelBtn'),
  deleteBtn:document.getElementById('deleteBtn'),
  toast:document.getElementById('toast'),
  detailSheet:document.getElementById('detailSheet'),
  detailNo:document.getElementById('detailNo'),
  detailTitle:document.getElementById('detailTitle'),
  detailTags:document.getElementById('detailTags'),
  detailDesc:document.getElementById('detailDesc'),
  detailDomain:document.getElementById('detailDomain'),
  detailOpenBtn:document.getElementById('detailOpenBtn'),
};

let allApps = [];
let activeTags = new Set();
let view = 'alpha';          // alpha | fav | popular | recent
let loaded = false;

/* ---------- 本機狀態 ---------- */
const readJSON = (k, fallback)=>{ try{ return JSON.parse(localStorage.getItem(k)) ?? fallback; }catch(e){ return fallback; } };
const writeJSON = (k, v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

let favorites = new Set(readJSON(FAV_KEY, []));
let usage = readJSON(USAGE_KEY, {});

/* ---------- 文字大小：標準 / 大 / 特大 ---------- */
const SCALES = [
  { v:1,    name:'標準' },
  { v:1.15, name:'大' },
  { v:1.3,  name:'特大' },
];
let scaleIdx = Math.min(Math.max(readJSON(SCALE_KEY, 0), 0), SCALES.length - 1);

function applyScale(){
  const s = SCALES[scaleIdx];
  document.documentElement.style.setProperty('--scale', s.v);
  els.fontBtn.classList.toggle('on', scaleIdx > 0);
  els.fontBtn.title = `文字大小：${s.name}`;
}
els.fontBtn.addEventListener('click', ()=>{
  scaleIdx = (scaleIdx + 1) % SCALES.length;
  writeJSON(SCALE_KEY, scaleIdx);
  applyScale();
  if(navigator.vibrate) navigator.vibrate(8);
});
applyScale();

const keyOf = a => (a.app + '::' + a.url).trim().toLowerCase();
const escapeHtml = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function domainOf(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; } }

function toggleFavorite(id, btn){
  const on = !favorites.has(id);
  on ? favorites.add(id) : favorites.delete(id);
  writeJSON(FAV_KEY, [...favorites]);
  if(navigator.vibrate) navigator.vibrate(8);
  if(view === 'fav' || view === 'alpha'){ render(); }   // 收藏區需要重排
  else if(btn){ btn.classList.toggle('active', on); btn.textContent = on ? '★' : '☆'; }
}
function trackUsage(id){
  usage[id] = (usage[id] || 0) + 1;
  writeJSON(USAGE_KEY, usage);
}

/* ---------- 卡片 ---------- */
function cardHtml(a){
  const id = keyOf(a);
  const fav = favorites.has(id);
  const tags = (a.tags || []).slice(0,2);
  return `
    <div class="card">
      <button class="stretched-link" data-detail="${escapeHtml(id)}"
              aria-label="查看 ${escapeHtml(a.app)} 的詳細資訊"></button>
      <span class="no">No. ${String(a.id).padStart(3,'0')}</span>
      <button class="star ${fav?'active':''}" data-fav="${escapeHtml(id)}"
              aria-pressed="${fav}" aria-label="收藏 ${escapeHtml(a.app)}">${fav?'★':'☆'}</button>
      <h2>${escapeHtml(a.app)}</h2>
      <p>${escapeHtml(a.describe || '（尚無說明）')}</p>
      ${tags.length ? `<div class="tag-row">${tags.map(t=>`<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="foot">
        <span class="domain">${escapeHtml(domainOf(a.url))}</span>
        ${a.row ? '' : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.7"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>`}
      </div>
      ${a.row ? `<button class="edit" data-edit="${a.row}" aria-label="編輯 ${escapeHtml(a.app)}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>` : ''}
    </div>`;
}

/* 事件委派：一次綁在 main 上，重繪時不必重新綁 */
els.main.addEventListener('click', (e)=>{
  const star = e.target.closest('[data-fav]');
  if(star){ e.preventDefault(); e.stopPropagation(); toggleFavorite(star.dataset.fav, star); return; }
  const pencil = e.target.closest('[data-edit]');
  if(pencil){
    e.preventDefault(); e.stopPropagation();
    const row = Number(pencil.dataset.edit);
    openEditor(allApps.find(a=> a.row === row) || null);
    return;
  }
  const detail = e.target.closest('[data-detail]');
  if(detail){
    e.preventDefault();
    openDetail(allApps.find(a=> keyOf(a) === detail.dataset.detail) || null);
    return;
  }
});

/* ---------- 篩選與排序 ---------- */
function computeFiltered(){
  const q = els.search.value.trim().toLowerCase();
  let list = allApps.filter(a=>{
    const okHidden = !a.app.trim().startsWith('Hidden');   // @ 開頭 → 隱藏
    const okQ = !q
      || a.app.toLowerCase().includes(q)
      || (a.describe||'').toLowerCase().includes(q)
      || (a.tags||[]).some(t=> t.toLowerCase().includes(q));
    const okT = activeTags.size === 0 || (a.tags||[]).some(t=> activeTags.has(t));
    return okQ && okT;
    });
    if(view === 'fav') list = list.filter(a=> favorites.has(keyOf(a)));
    if(view === 'popular') list = list.filter(a=> usage[keyOf(a)]);
 
    if(view === 'recent')       list.sort((a,b)=> b.id - a.id);
    else if(view === 'popular') list.sort((a,b)=> (usage[keyOf(b)]||0) - (usage[keyOf(a)]||0));
    else                        list.sort((a,b)=> a.app.localeCompare(b.app, 'zh-Hant'));
    return list;
  }

function groupByLetter(apps){
  const g = {};
  apps.forEach(a=>{
    let L = (a.app.trim()[0] || '#').toUpperCase();
    if(!/[A-Z]/.test(L)) L = '#';
    (g[L] ||= []).push(a);
  });
  return Object.keys(g).sort().map(L=>({ letter:L, items:g[L] }));
}

function renderChips(){
  const tags = [...new Set(allApps.flatMap(a=> a.tags || []))].sort((a,b)=> a.localeCompare(b,'zh-Hant'));
  els.chips.innerHTML =
    tags.map(t=>`<button data-tag="${escapeHtml(t)}" class="${activeTags.has(t)?'active':''}">${escapeHtml(t)}</button>`).join('')
    + (activeTags.size ? `<button class="clear-tags" data-clear="1">清除 ×</button>` : '');
}
els.chips.addEventListener('click', (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.clear){ activeTags.clear(); }
  else{ const t = b.dataset.tag; activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t); }
  render();
});

function emptyState(){
  if(view === 'fav')
    return `<div class="state"><h3>還沒有收藏</h3><p>點卡片右上角的星星，常用的工具就會釘在這一頁。</p></div>`;
  if(view === 'popular')
    return `<div class="state"><h3>還沒有使用紀錄</h3><p>開啟幾個工具之後，這裡會依照你開啟的次數排序。</p></div>`;
  return `<div class="state"><h3>沒有符合的項目</h3><p>換個關鍵字，或清除標籤篩選。</p></div>`;
}

function render(){
  if(!loaded) return;
  renderChips();

  if(allApps.length === 0){
    els.rail.hidden = true;
    els.count.textContent = '';
    els.main.innerHTML = `<div class="state"><h3>目錄是空的</h3><p>在試算表新增一列（App / Url / Describe），再回到這裡重新讀取。</p><button class="retry" id="retryBtn">重新讀取</button></div>`;
    document.getElementById('retryBtn').onclick = ()=> load(true);
    return;
  }

  const list = computeFiltered();
  els.count.textContent = `${list.length}/${allApps.length}`;

  if(list.length === 0){
    els.rail.hidden = true;
    els.main.innerHTML = emptyState();
    return;
  }

  let html = '';
  if(view === 'alpha'){
    const pinned = list.filter(a=> favorites.has(keyOf(a)));
    if(pinned.length) html += `<h2 class="section-label">★ 收藏</h2><div class="grid">${pinned.map(cardHtml).join('')}</div>`;
    const groups = groupByLetter(list);
    els.rail.hidden = false;
    els.rail.innerHTML = groups.map(g=>`<button data-letter="${g.letter}">${g.letter}</button>`).join('');
    html += groups.map(g=>`<h2 class="section-label" id="sec-${g.letter}">${g.letter}</h2><div class="grid">${g.items.map(cardHtml).join('')}</div>`).join('');
  }else{
    els.rail.hidden = true;
    const label = { fav:'★ 收藏', popular:'常用優先', recent:'最新加入' }[view];
    html += `<h2 class="section-label">${label}</h2><div class="grid">${list.map(cardHtml).join('')}</div>`;
  }
  els.main.innerHTML = html;
  els.main.prepend(els.offline);
}

els.rail.addEventListener('click', (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  document.getElementById('sec-' + b.dataset.letter)?.scrollIntoView({ block:'start' });
});

/* ---------- 分頁列 ---------- */
els.tabbar.addEventListener('click', (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  view = b.dataset.view;
  [...els.tabbar.children].forEach(x=> x.classList.toggle('active', x === b));
  window.scrollTo({ top:0 });
  render();
});

/* ---------- 搜尋 ---------- */
let searchTimer;
els.search.addEventListener('input', ()=>{
  els.searchWrap.classList.toggle('filled', els.search.value !== '');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 120);
});
els.search.addEventListener('keydown', e=>{ if(e.key === 'Enter') els.search.blur(); });
els.clearSearch.addEventListener('click', ()=>{
  els.search.value = '';
  els.searchWrap.classList.remove('filled');
  render();
  els.search.focus();
});

/* ---------- 捲動時收合品牌列，換更多內容空間 ---------- */
let lastY = 0, ticking = false;
const COLLAPSE_AT = 90;   // 捲過這個距離才開始收合
const DELTA = 10;         // 單次捲動要超過這個量才反應，避免臨界值來回抖動

window.addEventListener('scroll', ()=>{
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(()=>{
    const y = Math.max(0, window.scrollY);
    if(y <= COLLAPSE_AT){
      els.header.classList.remove('compact');   // 靠近頂端一律展開
    }else if(y - lastY > DELTA){
      els.header.classList.add('compact');       // 明顯往下捲 → 收合
    }else if(lastY - y > DELTA){
      els.header.classList.remove('compact');    // 明顯往上捲 → 展開
    }
    if(Math.abs(y - lastY) > DELTA || y <= COLLAPSE_AT) lastY = y;
    ticking = false;
  });
}, { passive:true });

/* 讓 A–Z 跳頁不被吸頂列擋住 */
const syncHeaderHeight = ()=>
  document.documentElement.style.setProperty('--header-h', els.header.offsetHeight + 'px');
new ResizeObserver(syncHeaderHeight).observe(els.header);

/* ---------- 讀取資料（JSONP，避開 Apps Script 沒有 CORS 標頭的問題） ---------- */
function api(params, timeout){
  return new Promise((resolve, reject)=>{
    const cb = 'indexCb_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    let done = false;
    const cleanup = ()=>{ try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); };
    window[cb] = d=>{ done = true; cleanup(); resolve(d); };
    const qs = Object.entries({ ...params, callback:cb, _:Date.now() })
      .map(([k,v])=> `${encodeURIComponent(k)}=${encodeURIComponent(v ?? '')}`).join('&');
    s.src = `${API_URL}?${qs}`;
    s.onerror = ()=>{ if(!done){ cleanup(); reject(new Error('jsonp failed')); } };
    setTimeout(()=>{ if(!done){ cleanup(); reject(new Error('timeout')); } }, timeout || 12000);
    document.body.appendChild(s);
  });
}
const loadViaJsonp = ()=> api({ action:'list' });

async function load(manual){
  const cached = readJSON(CACHE_KEY, null);

  // 有快取就先畫出來，開啟 App 幾乎是瞬間有畫面
  if(cached && cached.apps && !loaded){
    allApps = cached.apps;
    loaded = true;
    render();
  }else if(!loaded){
    els.main.innerHTML = '';
    els.main.append(els.offline, els.skeleton);
  }

  els.refreshBtn.classList.add('spin');
  try{
    const data = await loadViaJsonp();
    if(!data.ok) throw new Error('bad payload');
    adoptList(data.apps);
  }catch(err){
    if(loaded){
      els.offline.classList.add('show');   // 有舊資料就繼續用，只提示一行
    }else{
      els.main.innerHTML = `
        <div class="state">
          <h3>讀不到目錄</h3>
          <p>檢查網路連線，或確認 <code>API_URL</code> 指向你的 Apps Script 部署網址，且存取權限設為「任何人」。</p>
          <button class="retry" id="retryBtn">重新讀取</button>
        </div>`;
      document.getElementById('retryBtn').onclick = ()=> load(true);
    }
  }finally{
    els.refreshBtn.classList.remove('spin');
  }
}

els.refreshBtn.addEventListener('click', ()=> load(true));
window.addEventListener('online', ()=>{ if(els.offline.classList.contains('show')) load(); });

load();

/* ---------- 提示條 ---------- */
let toastTimer;
function toast(msg, ms){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> els.toast.classList.remove('show'), ms || 2400);
}

/* ---------- 詳細資訊視窗 ---------- */
let detailApp = null;

function openDetail(app){
  if(!app) return;
  detailApp = app;
  els.detailNo.textContent = 'No. ' + String(app.id).padStart(3,'0');
  els.detailTitle.textContent = app.app;
  const tags = app.tags || [];
  els.detailTags.innerHTML = tags.map(t=>`<span class="tag-pill">${escapeHtml(t)}</span>`).join('');
  els.detailDesc.textContent = app.describe || '（尚無說明）';
  els.detailDomain.textContent = domainOf(app.url);
  els.detailOpenBtn.href = app.url;
  els.detailSheet.classList.add('open');
}
function closeDetail(){
  els.detailSheet.classList.remove('open');
  detailApp = null;
}

els.detailOpenBtn.addEventListener('click', ()=>{
  if(detailApp) trackUsage(keyOf(detailApp));   // 打開網站才算一次使用（維持「常用」排序）
});
els.detailSheet.addEventListener('click', e=>{ if(e.target.dataset.close) closeDetail(); });

/* ---------- 編輯：新增 / 修改 / 刪除 ---------- */
let editing = null;      // null = 新增模式；否則是正在編輯的那一筆
let busy = false;

function adoptList(apps){
  allApps = apps;
  loaded = true;
  writeJSON(CACHE_KEY, { apps, at:Date.now() });
  els.offline.classList.remove('show');
  render();
}

function openEditor(app){
  editing = app || null;
  els.sheetTitle.textContent = editing ? '編輯項目' : '新增項目';
  els.fApp.value  = editing ? editing.app : '';
  els.fUrl.value  = editing ? editing.url : '';
  els.fDesc.value = editing ? (editing.describe || '') : '';
  els.descCount.textContent = els.fDesc.value.length;
  els.fTags.value = editing ? (editing.tags || []).join(', ') : '';
  els.deleteBtn.hidden = !editing;
  els.sheet.classList.add('open');
  setTimeout(()=> els.fApp.focus(), 60);
}
function closeEditor(){
  els.sheet.classList.remove('open');
  editing = null;
}

/* 說明字數即時更新 */
els.fDesc.addEventListener('input', ()=>{
  els.descCount.textContent = els.fDesc.value.length;
});

const ERRORS = {
  EMPTY:'名稱和網址都要填。',
  BAD_URL:'網址要以 http:// 或 https:// 開頭。',
  STALE:'這一筆在試算表被改動過了，請先重新讀取再編輯。',
  NO_HEADER:'試算表找不到 App / Url / Describe 標題列。',
  NO_ROW:'找不到這一列，可能已經被刪掉了。',
};

async function submitEditor(){
  if(busy) return;
  const app = els.fApp.value.trim();
  const url = els.fUrl.value.trim();
  if(!app || !url){ toast(ERRORS.EMPTY); return; }
  if(!/^https?:\/\//i.test(url)){ toast(ERRORS.BAD_URL); return; }

  const params = {
    action: editing ? 'update' : 'create',
    app, url,
    describe: els.fDesc.value.trim(),
    tags: els.fTags.value.trim(),
  };
  if(editing){ params.row = editing.row; params.expect = editing.app; }

  busy = true;
  els.saveBtn.disabled = true;
  els.saveBtn.textContent = '儲存中…';
  try{
    const res = await api(params, 20000);
    if(!res || !res.ok){
      const code = res && res.error;
      toast(ERRORS[code] || '存不進去，請稍後再試。');
      return;
    }
    adoptList(res.apps);
    closeEditor();
    toast(params.action === 'create' ? '已新增。' : '已更新。');
  }catch(err){
    toast('連不上目錄服務，檢查網路後再試一次。');
  }finally{
    busy = false;
    els.saveBtn.disabled = false;
    els.saveBtn.textContent = '儲存';
  }
}

async function deleteEntry(){
  if(busy || !editing) return;
  if(!window.confirm(`刪除「${editing.app}」？試算表裡的這一列會一起移除。`)) return;

  busy = true;
  els.deleteBtn.disabled = true;
  try{
    const res = await api({ action:'delete', row:editing.row, expect:editing.app }, 20000);
    if(!res || !res.ok){
      const code = res && res.error;
      toast(ERRORS[code] || '刪不掉，請稍後再試。');
      return;
    }
    adoptList(res.apps);
    closeEditor();
    toast('已刪除。');
  }catch(err){
    toast('連不上目錄服務，檢查網路後再試一次。');
  }finally{
    busy = false;
    els.deleteBtn.disabled = false;
  }
}

els.addBtn.addEventListener('click', ()=> openEditor(null));
els.saveBtn.addEventListener('click', submitEditor);
els.cancelBtn.addEventListener('click', closeEditor);
els.deleteBtn.addEventListener('click', deleteEntry);
els.sheet.addEventListener('click', e=>{ if(e.target.dataset.close) closeEditor(); });

document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(els.detailSheet.classList.contains('open')) closeDetail();
  else if(els.sheet.classList.contains('open')) closeEditor();
});

/* ---------- 安裝到主畫面 ---------- */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  els.installBtn.hidden = false;
});
els.installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  els.installBtn.hidden = true;
});
window.addEventListener('appinstalled', ()=>{ els.installBtn.hidden = true; });

/* ---------- Service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
